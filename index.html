<!DOCTYPE html>
<html>
<head>
<title>PK Earn App</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.header{
background:#111827;
padding:20px;
font-size:28px;
font-weight:bold;
}

.box{
background:#1e293b;
width:90%;
max-width:400px;
margin:20px auto;
padding:20px;
border-radius:15px;
}

input{
width:90%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
background:#22c55e;
color:white;
border:none;
padding:12px 25px;
font-size:18px;
border-radius:10px;
margin-top:15px;
cursor:pointer;
}

h1,h2,h3{
margin:10px;
}

.small{
font-size:14px;
color:#cbd5e1;
}

#dashboard{
display:none;
}

</style>
</head>

<body>

<div class="header">
PK Earn Website
</div>

<div id="loginPage">

<div class="box">

<h2>Login</h2>

<input type="text" id="number"
placeholder="Pakistan Number">

<input type="password" id="password"
placeholder="Password">

<button onclick="login()">Login</button>

<p class="small">
No OTP Required
</p>

</div>

</div>

<div id="dashboard">

<div class="box">
<h2>Subscription Plan</h2>

<h1>300 Rs</h1>

<p>15 Days Subscription</p>

<p>Daily 1 Ad Available</p>

<button onclick="buyPlan()">
Activate Plan
</button>

</div>

<div class="box">

<h2>Balance</h2>

<h1>
Rs <span id="balance">0</span>
</h1>

</div>

<div class="box">

<h2>Watch Ad</h2>

<p>Watch 10 Second Ad</p>

<button onclick="watchAd()">
Watch Ad
</button>

</div>

<div class="box">

<h2>Withdraw</h2>

<p>Minimum Withdraw 100 Rs</p>

<input type="text"
placeholder="JazzCash Number">

<button onclick="withdraw()">
Withdraw
</button>

</div>

<div class="box">

<h2>ID Verification</h2>

<input type="file">

<button onclick="submitID()">
Submit ID
</button>

</div>

</div>

<script>

let adWatched = false;

function login(){

let number =
document.getElementById("number").value;

let password =
document.getElementById("password").value;

if(number == "" || password == ""){

alert("Enter Number & Password");

}
else{

document.getElementById("loginPage")
.style.display = "none";

document.getElementById("dashboard")
.style.display = "block";

alert("Login Successful");

}

}

function buyPlan(){

alert("300 Rs Subscription Activated For 15 Days");

}

function watchAd(){

if(adWatched){

alert("Today's Ad Already Watched");

return;

}

alert("Ad Playing For 10 Seconds");

setTimeout(() => {

let balance =
document.getElementById("balance")
.innerText;

balance = Number(balance) + 100;

document.getElementById("balance")
.innerText = balance;

adWatched = true;

alert("100 Rs Added");

},10000);

}

function withdraw(){

let balance =
document.getElementById("balance")
.innerText;

if(balance >= 100){

alert("Withdraw Request Submitted");

}
else{

alert("Minimum Balance 100 Rs");

}

}

function submitID(){

alert("ID Submitted Successfully");

}

</script>

</body>
</html>
